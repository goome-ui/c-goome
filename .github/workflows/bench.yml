name: bench

on:
  workflow_dispatch:
    inputs:
      libs:
        description: "space separated, empty = all"
        default: ""

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install psutil
      - id: libs
        shell: bash
        run: |
          if [ -n "${{ inputs.libs }}" ]; then l="${{ inputs.libs }}"; elif [ -f tools/bench/libs.txt ]; then l=$(cat tools/bench/libs.txt | tr '\n' ' '); else l=""; fi
          echo "list=$l" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Windows' && contains(steps.libs.outputs.list, 'qt')
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_mingw
          tools: tools_mingw1310
      - if: runner.os == 'Windows' && contains(steps.libs.outputs.list, 'gtk4')
        id: msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-gtk4 mingw-w64-x86_64-pkgconf
      - if: runner.os == 'Windows' && contains(steps.libs.outputs.list, 'gtk4')
        shell: bash
        run: echo "MSYS2_ROOT=${{ steps.msys.outputs.msys2-location }}" >> "$GITHUB_ENV"
      - shell: bash
        run: python tools/bench/setup.py ${{ steps.libs.outputs.list }}
      - if: runner.os != 'Linux'
        shell: bash
        run: python tools/bench/run.py ${{ steps.libs.outputs.list }} --out bench-${{ matrix.os }}.json
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" python tools/bench/run.py ${{ steps.libs.outputs.list }} --out bench-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench-${{ matrix.os }}.json
