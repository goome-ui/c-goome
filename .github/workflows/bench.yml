name: bench

on:
  workflow_dispatch:
    inputs:
      libs:
        description: "space separated, empty = all"
        default: ""

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install psutil
      - run: python tools/bench/setup.py ${{ inputs.libs }}
      - if: runner.os != 'Linux'
        run: python tools/bench/run.py ${{ inputs.libs }} --out bench-${{ matrix.os }}.json
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" python tools/bench/run.py ${{ inputs.libs }} --out bench-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench-${{ matrix.os }}.json
